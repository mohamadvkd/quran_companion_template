name: quran_companion

description: قالب عربي حديث وقابل للتوسعة لتطبيق قرآن كريم.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_native_splash:
  color: "#F6F8F6"
  color_dark: "#101512"
  android_12:
    color: "#F6F8F6"
    color_dark: "#101512"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
